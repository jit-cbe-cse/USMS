name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Migrations apply cleanly
        env:
          FLASK_APP: app.py
          DATABASE_URL: sqlite:////tmp/ci.db
        run: flask db upgrade && flask seed-demo
