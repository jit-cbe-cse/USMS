{% extends "base.html" %}{% block title %}My logs{% endblock %}
{% block content %}
<div class="row" style="justify-content:space-between"><h1>My logs</h1><a class="btn" href="{{ url_for('student.edit_log') }}">New log</a></div>
{% for e in entries %}
<div class="card">
  <div class="row" style="justify-content:space-between">
    <b>{{ e.log_date }} · {{ e.title }}</b>
    <span class="muted">{{ e.internship.company.name }} · <a href="{{ url_for('student.edit_log', log_id=e.id) }}">Edit</a></span>
  </div>
  <div class="log-body">{{ e.body }}</div>
</div>
{% else %}<p class="muted">No logs yet.</p>{% endfor %}
{% endblock %}
